<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
<header>
  <div class="container">
    <div>
      <h1><a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></h1>
      <p>Подкаст о программировании, IT и смежных темах (16+)</p>
    </div>
    <nav>
      {{ $b := site.BaseURL }}
      <a href="{{ $b }}">Главная</a>
      <a href="{{ printf "%sepisodes/" $b }}">Выпуски</a>
      <a href="{{ printf "%slive/" $b }}">Вещание</a>
      <a href="{{ printf "%sguests/" $b }}">Стать гостем</a>
      <a href="{{ printf "%scontact/" $b }}">Связаться</a>
      <a href="{{ printf "%sfeed.xml" $b }}">RSS</a>
    </nav>
  </div>
</header>
<main class="container">
{{ block "main" . }}{{ end }}
</main>
<footer>
  <p>© 2014–{{ now.Year }} DevZen Podcast · <a href="{{ printf "%sfeed.xml" site.BaseURL }}">RSS</a></p>
</footer>
{{ partial "timestamps.html" . }}
</body>
</html>
