<itunes:author>{{ .Site.Params.podcast.itunesAuthor }}</itunes:author>
<itunes:summary>{{ .Site.Params.podcast.itunesSummary }}</itunes:summary>
<itunes:image href="{{ .Site.Params.podcast.itunesImage }}" />
<itunes:explicit>no</itunes:explicit>
<itunes:owner>
  <itunes:name>{{ .Site.Params.podcast.itunesOwnerName }}</itunes:name>
  <itunes:email>{{ .Site.Params.podcast.itunesOwnerEmail }}</itunes:email>
</itunes:owner>
<itunes:category text="{{ .Site.Params.podcast.itunesCategory }}" />
